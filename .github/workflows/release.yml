name: Publish Marketplace release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ok-el-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with Home Assistant hassfest
        uses: home-assistant/actions/hassfest@master
      - name: Verify version and file safety
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          root=Path(".")
          manifest=json.loads((root/"custom_components/ok_el/manifest.json").read_text())
          version=manifest["version"]
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version), version
          assert manifest["domain"]=="ok_el"
          assert (root/"hacs.json").is_file()
          assert (root/"RELEASE_NOTES.md").is_file()
          banned=["config.json","cookies.json","session.json"]
          assert not any((root/p).exists() for p in banned)
          assert not any(root.rglob("*.har"))
          assert not (root/"data").exists()
          print("Release validated:",version)
          PY
      - name: Run offline sensor tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate bundled history dashboard JavaScript
        run: node --check custom_components/ok_el/frontend/ok-el-history-card.js
      - name: Publish release for manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c 'import json;print(json.load(open("custom_components/ok_el/manifest.json"))["version"])')"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists; not changing it."
            exit 0
          fi
          gh release create "$version" --target "$GITHUB_SHA" --title "OK El $version" --notes-file RELEASE_NOTES.md
          echo "Published release $version."
