name: Test OK El changes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m compileall -q custom_components/ok_el tests
      - name: Unit tests for sensors and incremental history
        run: python3 -m unittest discover -s tests -v
      - name: JavaScript syntax of history card
        run: node --check custom_components/ok_el/frontend/ok-el-history-card.js
      - name: Verify metadata and energy integration
        uses: home-assistant/actions/hassfest@master
